<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2F7A58" />
  <meta name="description" content="Fix your anterior pelvic tilt with guided stretches and strengthening exercises. Daily routine, progress tracking, and expert tips." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TiltFix" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />

  <title>TiltFix — Fix Anterior Pelvic Tilt</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Install Banner -->
  <div id="install-banner" role="alertdialog" aria-label="Install TiltFix">
    <div>
      <p>📲 Add TiltFix to your Home Screen</p>
      <small>Use it offline, anytime, like a native app.</small>
    </div>
    <div class="install-actions">
      <button class="btn-primary" onclick="installApp()">Install</button>
      <button class="btn-secondary" onclick="dismissInstall()">Not now</button>
    </div>
  </div>

  <!-- App views -->
  <div id="app">

    <!-- HOME -->
    <div id="view-home" class="view active" role="main" aria-label="Home">
      <div id="home-content"></div>
    </div>

    <!-- EXERCISES -->
    <div id="view-exercises" class="view" role="main" aria-label="Exercises">
      <div class="page-header">
        <h1>Exercises</h1>
        <p>Tap any exercise to see instructions &amp; tips</p>
      </div>
      <div id="exercises-content"></div>
    </div>

    <!-- ROUTINE -->
    <div id="view-routine" class="view" role="main" aria-label="Daily Routine">
      <div class="page-header">
        <h1>Daily Routine</h1>
        <p>Complete every exercise to log your session</p>
      </div>
      <div id="routine-content"></div>
    </div>

    <!-- PROGRESS -->
    <div id="view-progress" class="view" role="main" aria-label="Progress">
      <div class="page-header">
        <h1>Progress</h1>
        <p>Track your consistency and streaks</p>
      </div>
      <div id="progress-content"></div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" role="navigation" aria-label="Main navigation">

    <button class="nav-item active" data-view="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 21 9 12 15 12 15 21"/>
      </svg>
      <span class="nav-label">Home</span>
    </button>

    <button class="nav-item" data-view="exercises" aria-label="Exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h11"/>
        <circle cx="3" cy="6.5" r="1.5"/>
        <circle cx="3" cy="12" r="1.5"/>
        <circle cx="3" cy="17.5" r="1.5"/>
      </svg>
      <span class="nav-label">Exercises</span>
    </button>

    <button class="nav-item" data-view="routine" aria-label="Routine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="nav-label">Routine</span>
    </button>

    <button class="nav-item" data-view="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="nav-label">Progress</span>
    </button>

  </nav>

  <script src="/app.js"></script>
</body>
</html>
