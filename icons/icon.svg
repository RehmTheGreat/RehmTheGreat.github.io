<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="#2F7A58"/>
  <!-- Head -->
  <circle cx="256" cy="128" r="44" fill="white"/>
  <!-- Spine -->
  <line x1="256" y1="176" x2="256" y2="348" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="186" y1="220" x2="326" y2="220" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Hips -->
  <line x1="196" y1="348" x2="316" y2="348" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="210" y1="348" x2="190" y2="440" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="302" y1="348" x2="322" y2="440" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Alignment indicator (small checkmark near pelvis) -->
  <circle cx="316" cy="348" r="28" fill="#A8DABC"/>
  <polyline points="305,348 313,357 327,340" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
